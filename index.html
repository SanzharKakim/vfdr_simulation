<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Крос-резервирование: симуляция</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--fg:#10161f;--mute:#5d6878;--off:#c3cad6;--drive:#1560d6;--mains:#14893f;--warn:#c76a00;--bad:#d1281c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b23;--fg:#e8ecf2;--mute:#8e98a8;--off:#394251;--drive:#5aa7ff;--mains:#45c274;--warn:#f2a33a;--bad:#ff6f62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b23;--fg:#e8ecf2;--mute:#8e98a8;--off:#394251;--drive:#5aa7ff;--mains:#45c274;--warn:#f2a33a;--bad:#ff6f62;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px}
main{max-width:1000px;margin:0 auto}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 14px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border-radius:12px;padding:12px 14px 14px;outline:2px solid transparent;transition:outline-color .2s}
.card.flash{outline-color:var(--bad)}
.card h2{font-size:16px;margin:0 0 4px}
svg{width:100%;height:auto;display:block}
svg text{font-size:11px;fill:var(--fg)}
svg .mut{fill:var(--mute);font-size:10px}
svg .big{font-size:13px;font-weight:700}
.w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.s{stroke:var(--fg);stroke-width:2;stroke-linecap:round}
.bl{stroke-width:2.6;stroke-linecap:round}
.dot{fill:var(--fg)}
.kc{cursor:pointer}
.kc:hover .dot{fill:var(--drive)}
.il{stroke:var(--mute);stroke-width:1.3;stroke-dasharray:4 3;fill:none}
.box{fill:var(--card);stroke:var(--fg);stroke-width:2}
.mot{fill:var(--card);stroke-width:3}
.rot line{stroke:var(--fg);stroke-width:2.5;stroke-linecap:round}
.ctl{display:grid;gap:8px;margin-top:6px}
.ctl label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl input{flex:1;min-width:120px;accent-color:var(--drive)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--off);background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--drive)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.kc:focus-visible{outline:2px solid var(--drive);outline-offset:2px}
button.on{background:var(--drive);border-color:var(--drive);color:#fff}
.st{color:var(--mute);font-size:13px;min-height:2.6em}
.st b{color:var(--fg)}
#log{background:var(--card);border-radius:12px;margin-top:16px;padding:10px 14px;max-height:220px;overflow:auto;font-size:13px}
#log div{padding:2px 0}
#log .bad{color:var(--bad)}#log .ok{color:var(--mains)}#log .warn{color:var(--warn)}#log .sep{color:var(--drive);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
select{font:inherit;padding:7px 8px;border-radius:8px;border:1px solid var(--off);background:var(--card);color:var(--fg)}
.scroll{overflow-x:auto}svg.sc{min-width:760px}.sc-card{margin-bottom:16px}.dn{border-color:var(--bad);color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{padding:8px 14px}
.tabs button.on{background:var(--drive);border-color:var(--drive);color:#fff}
.info{background:var(--card);border-radius:12px;padding:12px 16px;margin:0 0 16px}
.info h2{font-size:17px;margin:0 0 4px}
.info p{margin:4px 0}
.info .slide{font-style:italic;border-left:4px solid var(--bad);padding-left:10px;margin:8px 0}
.info ul{margin:6px 0 0;padding-left:20px}.info li{margin:3px 0}
.tools{margin-top:8px}.tools .grow{flex:1}
.banner{background:var(--card);border-radius:12px;padding:12px 16px;margin:0 0 16px;border-left:6px solid var(--drive)}
.banner[hidden],#cases[hidden]{display:none}
.banner.run{border-left-color:var(--warn)}.banner.done{border-left-color:var(--mains)}.banner.fail{border-left-color:var(--bad)}
.banner .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.banner .bt{font-size:17px;font-weight:700}
.banner .bd{color:var(--mute);font-size:13px;max-width:78ch}
#cases{background:var(--card);border-radius:12px;padding:12px 16px;margin-top:16px}
#cases h2{font-size:16px;margin:0 0 4px}
#cases p{color:var(--mute);font-size:13px;margin:4px 0 8px}
table.cases{width:100%;border-collapse:collapse;font-size:13px}
table.cases th,table.cases td{text-align:left;vertical-align:top;padding:6px 8px;border-top:1px solid var(--off)}
table.cases tr.cur{background:color-mix(in srgb,var(--warn) 16%,transparent)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--off);color:var(--mute);white-space:nowrap}
.chip.ok{border-color:var(--mains);color:var(--mains)}.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.run{border-color:var(--warn);color:var(--warn)}
body.stress .ctl,body.stress svg .kc{pointer-events:none}
body.stress .ctl{opacity:.55}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:92vw;font-size:14px}#toast.show{opacity:1}body.stress #opts{pointer-events:none;opacity:.55}#opts label{margin-right:16px}
.info h3{font-size:15px;margin:14px 0 6px}table.modes td:first-child{white-space:nowrap}table.modes tr.err{background:color-mix(in srgb,var(--bad) 8%,transparent)}
</style>
</head>
<body>
<main>
<div class="top"><div>
<h1>Крос-резервирование приводов: симуляция</h1>
<p class="lead">Два привода и две группы по четыре двигателя. Схема разбита на этапы заданий: от исходной схемы до итоговой версии. Контакторы на схеме нажимаются.</p></div>
<button id="reset">Сбросить</button></div>
<div class="tabs" id="tabs" role="tablist"></div>
<section class="info" id="info"></section>
<section class="banner" id="opts" hidden><label><input type="checkbox" id="pre"> Вытеснение: привод на ходу проверяет, нет ли стоящего двигателя с более высоким приоритетом</label><label>Порядок при равном приоритете <select id="ord"><option value="0">сначала свой</option><option value="1">сначала чужой (отказавшего)</option><option value="2">по очереди</option></select></label></section>
<section class="banner" id="sbar" hidden><div class="row"><div><div class="bt" id="bt"></div><div class="bd" id="bd"></div></div><button id="stbtn"></button></div></section>
<div class="card sc-card"><div class="scroll"><svg class="sc" id="scene" viewBox="0 0 880 412" role="img" aria-label="Схема"></svg></div><div class="btns tools"><button id="tiebtn"></button><span class="st grow" id="tst"></span><label>Скорость симуляции <select id="spd"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option><option value="8">×8</option></select></label></div></div>
<div class="grid" id="grid"></div>
<section id="cases" hidden></section>
<div id="log" aria-live="polite"></div>
</main>
<div id="toast" role="alert"></div>
<script>
const $=id=>document.getElementById(id);
const FAIL_MS=20000;
const PR=[1,2,3,4]; // приоритет двигателей M1..M4 в каждой группе: 1 — высший, 4 — низший
const XS=[50,140,230,320],OX=[0,460];
const cl=(v,r)=>Math.max(-r,Math.min(r,v));
const ABORT={abort:true};
addEventListener('unhandledrejection',e=>{if(e.reason===ABORT)e.preventDefault()});
let PRE=0,ORD=0,ALT=0,PREN=0,F={},stage=0,D=[],G=[],tie=false,last=performance.now(),VT=0,SPEED=1,timers=[],RUN=0,DEAD=()=>false;
const ST={on:false,cancel:false,cur:-1,res:[],viol:null,t0:0,phase:''};
/* виртуальное время: sleep отменяется при сбросе (abortAll), rsleep живёт для сценария стресс-теста */
const mk=(r,ms)=>new Promise((res,rej)=>timers.push({t:VT+ms,res,rej,r}));
const sleep=ms=>mk('a',ms),rsleep=ms=>mk('r',ms);
function abortAll(){const a=timers.filter(x=>x.r=='a');timers=timers.filter(x=>x.r!='a');a.forEach(x=>x.rej(ABORT))}
function pump(){const d=timers.filter(x=>x.t<=VT);timers=timers.filter(x=>x.t>VT);d.forEach(x=>x.res())}
const left=d=>Math.max(0,Math.ceil((FAIL_MS-(VT-D[d].fat))/1000));
const fmt=ms=>String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),4000);document.querySelectorAll('.card').forEach(c=>{c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1400)})}
function log(t,c){if(c=='bad'&&!ST.on)toast(t);const d=document.createElement('div');d.className=c||'';d.textContent=fmt(VT)+'  '+t;$('log').prepend(d);while($('log').children.length>80)$('log').lastChild.remove()}
const nm=(k,i,t)=>t=='o'?`KM${k+1}.0`:t=='b'?`KM${k+1}.Б`:`KM${k+1}.${i+1}.${t=='d'?1:2}`;
const outr=d=>D[d].run&&!D[d].failed&&D[d].out>.3; // привод выдаёт частоту
const outp=d=>outr(d)&&D[d].oc; // частота доходит до шины (выходной контактор замкнут)
const drv=k=>tie?(D[0].run?0:D[1].run?1:(D[k].failed?1-k:k)):k;
const bus=k=>{if(G[k].bp)return{f:50,d:-1,m:true};const d=drv(k);return outp(d)?{f:D[d].out,d,m:false}:{f:0,d,m:false}};
const pw=(k,i)=>{const g=G[k],b=bus(k);return g.kd[i]&&b.f>.3?{f:b.f,s:b.m?'mains':'drive'}:g.km[i]?{f:50,s:'mains'}:{f:0,s:'dead'}};
const mem=k=>tie?[0,1]:[k];
const kdOf=(k,ex)=>{for(const m of mem(k))for(let i=0;i<4;i++)if(G[m].kd[i]&&!(ex&&ex[0]==m&&ex[1]==i))return[m,i];return null};
const wd=()=>D[0].failed?1:D[1].failed?0:D[0].run?0:D[1].run?1:0; // привод, ведущий обе группы при замкнутом KMс

/* ---------- этапы ---------- */
const STG=[
{tab:'Исходная схема',F:{},title:'Исходная схема (слайд 2)',
 slide:'Два привода: Drive 1, Drive 2. Две группы двигателей.',
 text:'Каждый привод питает свою группу из четырёх двигателей через общую шину ~Hz. Контакторов нет: все четыре двигателя подключены к приводу постоянно.',
 how:['Нажмите «Пуск привода»: появится ошибка, потому что привод не может одновременно разгонять все 4 двигателя.','Это отправная точка. Дальше схему дооснащают контакторами.']},
{tab:'Задание 1 · Байпасирование',F:{kd:1,km:1},title:'Задание 1. Байпасирование (слайд 3)',
 slide:'Дооснастить контакторами схему так, чтобы привод мог управлять любым двигателем в своей группе двигателей через байпасирование.',
 text:'У каждого двигателя два контактора: KMn.i.1 к шине ~Hz привода и KMn.i.2 к сети, они заблокированы друг с другом. Привод ведёт один двигатель за раз: плавно разгоняет его с 0 до 50 Гц (~Hz = Hz), передаёт на сеть (байпас) и берёт следующий. Так один привод обслуживает всю группу.',
 how:['«Автозапуск всех двигателей»: привод по очереди разгоняет двигатели, передаёт их на сеть и берёт следующий.','«Пуск и передача на сеть»: то же для выбранного двигателя.','Ошибка: подключить к сети вращающийся двигатель не на 50 Гц нельзя (~Hz ≠ Hz).','Ошибка: два двигателя на один привод, либо KMn.i.1 и KMn.i.2 одного двигателя одновременно.','Перевода на сеть при отказе привода здесь нет, он появится в задании 2 (резервирование).']},
{tab:'Задание 2 · Резервирование',F:{kd:1,km:1,res:1},title:'Задание 2. Резервирование (слайд 4)',
 slide:'Чтобы привод мог передать любой двигатель в своей группе двигателей на прямое питание сети для обеспечения резервирования.',
 text:'Схема та же, что в задании 1, но добавлена кнопка отказа привода и автоматический перевод двигателей на сеть. При отказе привода его двигатель выбегает, а когда остановится, подключается к сети напрямую (прямой пуск). Остальные двигатели группы тоже переводятся на сеть по очереди, и группа работает без привода.',
 how:['Нажмите «Автозапуск», затем «Отказ привода»: двигатель на приводе выбегает, потом его KMn.i.2 включается (прямой пуск, предупреждение о токе). Остальные двигатели группы тоже переводятся на сеть по очереди.','Если привод не работает и двигатель стоит (0 Гц), его можно подключить к сети вручную: это прямой пуск.','Вращающийся двигатель можно подключать к сети только на 50 Гц (~Hz = Hz).','«Восстановить привод», затем «Вернуть на привод»: двигатель с сети подхватывается приводом на ходу при 50 Гц.']},
{tab:'Задание 3 · Крос-резервирование',F:{kd:1,km:1,tie:1,oc:1},title:'Задание 3. Крос-резервирование (слайд 5)',
 slide:'Чтобы при отказе любого привода оставшийся мог управлять любым двигателем любой группы двигателей.',
 text:'Добавлены секционный контактор KMс между шинами ~Hz двух групп и выходной контактор KMn.0 у каждого привода: отказавший привод отделяется от шины.',
 how:['Нажмите «Автозапуск» у привода 1, затем «Отказ привода»: KMn.0 отделит отказавший привод, KMс замкнётся, привод 2 продолжит запуск группы 1.','Восстановить привод, включить KMn.0 и разомкнуть KMс нужно вручную.','Что убирает итоговая версия: фиксированный порядок M1…M4, ручное восстановление, нет приоритетов.']},
{tab:'Итоговая версия',F:{kd:1,km:1,tie:1,oc:1,timer:1,prio:1,stress:1},title:'Итоговая версия',
 slide:'',
 text:'К крос-резервированию добавлено: автоматика на 20 секунд отказа, приоритеты двигателей (1 — высший, 4 — низший), настройки порядка и вытеснения, стресс-тест всех кейсов.',
 how:['Отказ привода: выход отключается, включается KMс, оставшийся привод ведёт двигатели обеих групп по приоритету. Через 20 с привод возвращается, KMс размыкается.','Привод не разгоняет двигатели, которые ещё в выбеге: берёт самый приоритетный из остановившихся.','Переключатель «Вытеснение»: привод на ходу проверяет, не остановился ли двигатель с более высоким приоритетом, и если да, бросает текущий и берёт его.','Переключатель «Порядок при равном приоритете»: сначала свой, сначала чужой или по очереди.','«Запустить стресс-тест» проходит все кейсы, название кейса пишется в верхней рамке.']}
];

const MODES=[`<h3>Таблица режимов работы</h3><div class="scroll"><table class="cases modes"><thead><tr><th>Режим</th><th>Привод</th><th>Контакторы</th><th>Двигатели</th><th>Условие, замечание</th></tr></thead><tbody><tr><td><b>Всё остановлено</b></td><td>Стоп, 0 Гц</td><td>Контакторов нет, все 4 двигателя подключены к приводу постоянно</td><td>Стоят</td><td>Исходное состояние</td></tr><tr><td><b>Пуск привода</b></td><td>Run, 0→50 Гц</td><td>Контакторов нет</td><td>Все 4 двигателя разгоняются одновременно</td><td>Недопустимо: один привод не может вести 4 двигателя. Симуляция выдаёт ошибку</td></tr><tr class="err"><td><b>Отказ привода</b></td><td>Авария, выход отключён</td><td>Контакторов нет</td><td>Все 4 останавливаются выбегом</td><td>Резерва нет, группа полностью без управления</td></tr></tbody></table></div>`,`<h3>Таблица режимов работы</h3><div class="scroll"><table class="cases modes"><thead><tr><th>Режим</th><th>Привод</th><th>Контакторы</th><th>Двигатели</th><th>Условие, замечание</th></tr></thead><tbody><tr><td><b>Всё остановлено</b></td><td>Стоп, 0 Гц</td><td>KMn.i.1 и KMn.i.2 отключены</td><td>Стоят</td><td>Исходное состояние</td></tr><tr><td><b>Разгон двигателя приводом</b></td><td>Run, плавно 0→50 Гц</td><td>KMn.i.1 включён при 0 Гц, KMn.i.2 отключён</td><td>Mi разгоняется с 0 до 50 Гц</td><td>Привод ведёт один двигатель за раз</td></tr><tr><td><b>Передача на сеть (байпас)</b></td><td>50 Гц, затем Run снимается</td><td>KMn.i.1 отключается, пауза, KMn.i.2 включается</td><td>Mi продолжает вращаться на 50 Гц</td><td>Только при ~Hz = Hz</td></tr><tr><td><b>Работа от сети</b></td><td>Свободен, 0 Гц, берёт следующий двигатель</td><td>KMn.i.1 отключён, KMn.i.2 включён</td><td>Mi на 50 Гц от сети</td><td>Привод ведёт Mj</td></tr><tr><td><b>Возврат на привод</b></td><td>Выходит на 50 Гц до включения</td><td>KMn.i.2 отключается, пауза, KMn.i.1 включается</td><td>Mi подхватывается приводом на ходу</td><td>Привод должен быть свободен</td></tr><tr class="err"><td><b> d>Иначе бросок тока, нужно ~Hz = Hz</td></tr><tr class="err"><td><b>Ошибка: оба контактора</b></td><td>Любой</td><td>KMn.i.1 и KMn.i.2 одновременно</td><td>Не включается</td><td>Блокировка двигателя</td></tr><tr><td><b>Восстановление и возврат</b></td><td>Исправен, выходит на 50 Гц</td><td>KMn.i.2 отключается, пауза, KMn.i.1 включается</td><td>Двигатель подхватывается приводом на ходу</td><td>Вручную: «Восстановить привод», затем «Вернуть на привод»</td></tr></tbody></table></div>`,`<h3>Таблица режимов работы</h3><div class="scroll"><table class="cases modes"><thead><tr><th>Режим</th><th>Привод</th><th>Контакторы</th><th>Двигатели</th><th>Условие, замечание</th></tr></thead><tbody><tr><td><b>Норма</b></td><td>Каждый привод ведёт свою группу</td><td>KMс отключён, KMn.0 включены, остальные по заданию 2</td><td>Каждая группа обслуживается своим приводом</td><td>Привод 1 группа 1, привод 2 группа 2</td></tr><tr class="err"><td><b>Отказ привода 1</b></td><td>Привод 1 в аварии, выход отключён</td><td>KM1.0 отключается, затем включается KMс, KM1.i.1 отказавшего двигателя отключается</td><td>Двигатели на сети продолжают работать, остальные ждут привод 2</td><td>Отказавший привод отделён от шины</td></tr><tr><td><b>Привод 2 ведёт обе группы</b></td><td>Привод 2: 0→50 Гц, передача на сеть</td><td>KMс включён, KM1.i.1 или KM2.j.1 включён только у одного двигателя</td><td>Двигатели запускаются по очереди и передаются на сеть</td><td>Только один двигатель на привод</td></tr><tr class="err"><td><b>Отказ привода 2</b></td><td>Привод 2 в аварии</td><td>KM2.0 отключается, KMс включается</td><td>Привод 1 ведёт обе группы</td><td>Зеркально отказу привода 1</td></tr><tr><td><b>Восстановление</b></td><td>Привод исправен</td><td>KMn.0 включается вручную, KMс отключается вручную</td><td>Каждая группа снова под своим приводом</td><td>Вручную</td></tr><tr class="err"><td><b>Двойной отказ</b></td><td>Оба привода в аварии</td><td>Оба KMn.0 отключены</td><td>Двигатели на сети работают, остальные стоят</td><td>Управление невозможно</td></tr><tr class="err"><td><b>Ошибка: KMс при двух работающих</b></td><td>Оба выдают частоту</td><td>Включение KMс</td><td>Не включается</td><td>Блокировка: нельзя соединить два инвертора</td></tr></tbody></table></div>`,`<h3>Таблица режимов работы</h3><div class="scroll"><table class="cases modes"><thead><tr><th>Режим</th><th>Привод</th><th>Контакторы</th><th>Двигатели</th><th>Условие, замечание</th></tr></thead><tbody><tr><td><b>Норма</b></td><td>Каждый привод ведёт свою группу</td><td>KMс отключён, KMn.0 включены</td><td>Каждая группа обслуживается своим приводом</td><td>Приоритет двигателей: 1 высший, 4 низший</td></tr><tr class="err"><td><b>Отказ привода</b></td><td>Выход отключён, таймер 20 с</td><td>KMn.0 отказавшего отключается, KMс включается</td><td>Оставшийся привод ведёт двигатели обеих групп по приоритету</td><td>Автоматически, без действий оператора</td></tr><tr><td><b>Выбор двигателя</b></td><td>Берёт самый приоритетный из остановившихся</td><td>KMn.i.1 нужного двигателя</td><td>Двигатели в выбеге не берутся, пока не остановятся</td><td>Равный приоритет: сначала свой, сначала чужой или по очереди</td></tr><tr><td><b>Вытеснение (если включено)</b></td><td>На ходу проверяет, не остановился ли двигатель выше приоритетом</td><td>Текущий KMn.i.1 отключается, затем включается KMn.j.1 с высшим приоритетом</td><td>Текущий выбегает, высший разгоняется</td><td>Только при включённой настройке «Вытеснение»</td></tr><tr><td><b>Автовосстановление через 20 с</b></td><td>Привод возвращается в норму</td><td>KMс отключается, KMn.0 включается</td><td>Каждая группа под своим приводом, проверяется 4 из 4 на сети</td><td>Если не все на сети, привод докапливает остальные</td></tr><tr class="err"><td><b>Двойной или повторный отказ</b></td><td>Оба привода или повторная авария после возврата</td><td>Оба KMn.0 отключены, затем цикл повторяется</td><td>Остаются работать только двигатели на сети</td><td>Стресс-тест проверяет все кейсы</td></tr></tbody></table></div>`];
function mkState(){
 D=[0,1].map(()=>({run:false,set:35,out:0,failed:false,busy:false,fat:0,oc:true}));
 G=[0,1].map(()=>({kd:F.kd?[true,false,false,false]:[true,true,true,true],km:[false,false,false,false],w:[0,0,0,0],ang:[0,0,0,0],auto:false,bp:false}));
 tie=false;
}

/* ---------- схема ---------- */
function grp(k){
 const o=OX[k],P=`g${k}-`,X=x=>o+x;
 const ln=(id,x1,y1,x2,y2)=>`<line id="${P}${id}" class="w" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
 const ct=(id,x,y,lab,cls,left)=>`<g id="${P}${id}" class="${cls||'kc'}"${cls=='kx'?'':` tabindex="0" role="button"`} aria-label="${lab}"><line class="s" x1="${x}" y1="${y}" x2="${x}" y2="${y+10}"/><line class="s" x1="${x}" y1="${y+26}" x2="${x}" y2="${y+36}"/><line class="bl" x1="${x}" y1="${y+26}" x2="${x}" y2="${y+10}"/><circle class="dot" cx="${x}" cy="${y+10}" r="2.5"/><circle class="dot" cx="${x}" cy="${y+26}" r="2.5"/><rect x="${x-20}" y="${y-2}" width="40" height="40" fill="transparent"/><text x="${left?x-16:x+16}" y="${y+22}"${left?' text-anchor="end"':''}>${lab}</text></g>`;
 const mx=k?o+410:10,b1=k?o+50:10,b2=k?o+410:320;
 let s=F.km?ln('sd',mx,20,mx,395)+ln('mb',b1,395,b2,395):'';
 s+=ln('d',X(185),20,X(185),50)
  +`<rect id="${P}box" class="box" x="${X(145)}" y="50" width="80" height="50" rx="4"/><text x="${X(185)}" y="70" text-anchor="middle">Drive ${k+1}</text><text id="${P}df" class="big" x="${X(185)}" y="90" text-anchor="middle"></text>`;
 s+=F.oc?ln('e',X(185),100,X(185),104)+ct('oc',X(185),104,nm(k,0,'o'),F.timer?'kx':'kc',true)+ln('e2',X(185),140,X(185),150):ln('e',X(185),100,X(185),150);
 s+=ln('bus',X(50),150,X(F.bp?365:320),150)+`<text id="${P}bf" class="mut" x="${X(196)}" y="128"></text>`;
 if(F.bp)s+=ln('bpa',X(365),20,X(365),62)+ct('bp',X(365),62,nm(k,0,'b'),'kc',true)+ln('bpb',X(365),98,X(365),150);
 XS.forEach((x0,i)=>{const x=X(x0);
  s+=F.kd?ln('t'+i,x,150,x,172)+ln('v'+i,x,208,x,221)+ct('kd'+i,x,172,nm(k,i,'d')):ln('t'+i,x,150,x,221);
  if(F.km)s+=ln('l'+i,x,259,x,300)+ln('z'+i,x,336,x,395)+`<path class="il" d="M${x} 190h-22v128h22"/>`+ct('km'+i,x,300,nm(k,i,'m'));
  s+=`<g transform="translate(${x} 240)"><circle id="${P}mc${i}" class="mot" r="19"/><g id="${P}mr${i}" class="rot"><line x1="-12" y1="0" x2="12" y2="0"/><line x1="-12" y1="0" x2="12" y2="0" transform="rotate(60)"/><line x1="-12" y1="0" x2="12" y2="0" transform="rotate(120)"/></g></g><text id="${P}mt${i}" class="mut" x="${x+22}" y="238"></text><text id="${P}mu${i}" class="mut" x="${x+22}" y="251"></text>`;
  if(F.prio)s+=`<text class="mut" x="${x+22}" y="264">приор. ${PR[i]}</text>`});
 return s;
}
function scene(){
 let s=`<text class="big" x="12" y="14">Hz</text><line id="top" class="w" x1="10" y1="20" x2="870" y2="20"/>`+grp(0)+grp(1);
 if(F.tie)s+=`<line id="tl" class="w" x1="320" y1="150" x2="397" y2="150"/><line id="tr" class="w" x1="433" y1="150" x2="510" y2="150"/><g id="tie" class="kc" tabindex="0" role="button" aria-label="KMс"><line class="s" x1="397" y1="150" x2="407" y2="150"/><line class="s" x1="423" y1="150" x2="433" y2="150"/><line id="tbl" class="bl" x1="423" y1="150" x2="407" y2="150"/><circle class="dot" cx="407" cy="150" r="2.5"/><circle class="dot" cx="423" cy="150" r="2.5"/><rect x="391" y="134" width="48" height="32" fill="transparent"/><text x="415" y="176" text-anchor="middle">KMс</text></g>`;
 $('scene').setAttribute('viewBox',`0 0 880 ${F.km?412:290}`);
 $('scene').innerHTML=s;
}
const U=fn=>(...a)=>{if(ST.on){log('Идёт стресс-тест: ручное управление отключено','bad');return}return fn(...a)};
function ctl(k){
 const P=`g${k}-`,c=document.createElement('section');c.className='card';c.id=P+'card';
 const msel=`<label>Двигатель <select id="${P}sel">${[1,2,3,4].map(n=>`<option value="${n-1}">M${n}</option>`).join('')}</select></label>`;
 const base=`<label>Задание частоты <b id="${P}sv">35</b> Гц <input id="${P}sl" type="range" min="0" max="50" step="1" value="35" aria-label="Задание частоты привода ${k+1}"></label>`;
 const rf=`<button id="${P}run"></button>`+((F.tie||F.res)?`<button id="${P}fail" class="dn"></button>`:'');
 let rows;
 if(F.km)rows=`<div class="btns"><button id="${P}aa"></button>${rf}</div><div class="btns">${msel}<button id="${P}ts">Пуск и передача на сеть</button><button id="${P}td">Вернуть на привод</button></div>`;
 else if(F.kd)rows=`<div class="btns"><button id="${P}aa"></button>${rf}</div><div class="btns">${msel}<button id="${P}s1">Сменить двигатель</button></div>`;
 else rows=`<div class="btns">${rf}</div>`;
 c.innerHTML=`<h2>Привод ${k+1}: группа ${k+1}</h2><div class="ctl">${base}${rows}<div class="st" id="${P}st"></div></div>`;
 $('grid').appendChild(c);
 const sel=()=>+$(P+'sel').value;
 for(let i=0;i<4;i++){if(F.kd)$(P+'kd'+i).onclick=U(()=>tog(k,'d',i));if(F.km)$(P+'km'+i).onclick=U(()=>tog(k,'m',i))}
 if(F.oc&&!F.timer)$(P+'oc').onclick=U(()=>tog(k,'o'));
 if(F.bp)$(P+'bp').onclick=U(()=>tog(k,'b'));
 $(P+'sl').oninput=e=>{D[k].set=+e.target.value;$(P+'sv').textContent=D[k].set};
 $(P+'run').onclick=U(()=>{
  if(!F.kd){log('Ошибка: привод не может одновременно разгонять все 4 двигателя группы. Выбрать один двигатель нечем, контакторов нет','bad');return}
  if(D[k].failed||G[k].auto||D[k].busy){log('Сейчас запустить привод вручную нельзя','bad');return}
  if(!D[k].run&&tie&&outp(1-k)){log(`Блокировка: KMс включён, привод ${2-k} уже выдаёт частоту`,'bad');return}
  D[k].run=!D[k].run;log(`Привод ${k+1}: ${D[k].run?'запущен (Run)':'остановлен'}`)});
 if(F.tie||F.res)$(P+'fail').onclick=U(()=>{if(!D[k].failed)onFail(k);else if(!F.timer){D[k].failed=false;log(`Привод ${k+1} восстановлен`+(F.tie?'. Чтобы разъединить шины, нажмите KMс':'')+(F.oc?`. Включите ${nm(k,0,'o')} вручную`:''),'ok')}});
 if(F.kd)$(P+'aa').onclick=U(()=>{if(G[k].auto){G[k].auto=false;log(`Гр.${k+1}: автозапуск остановится после текущего двигателя`)}else autoAll(k)});
 if(F.km){$(P+'td').onclick=U(()=>toDrive(k,sel()));$(P+'ts').onclick=U(()=>softStart(k,sel()))}else if(F.kd)$(P+'s1').onclick=U(()=>sw1(k,sel()));
}
function warn(k,t){log(`Гр.${k+1}: ${t}`,'warn');const c=$(`g${k}-card`);if(!c)return;c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1400)}

/* ---------- ручные контакторы ---------- */
function tog(k,t,i){
 const g=G[k],d=drv(k);
 if(D[d].busy||g.auto){log('Идёт автоматическая работа привода, подождите','bad');return}
 if(t=='o'){
  if(D[k].oc){if(outr(k)&&D[k].out>1)warn(k,`${nm(k,0,'o')} отключён под током. Сначала снимите Run`);D[k].oc=false;log(`${nm(k,0,'o')} отключён`)}
  else{
   if(g.bp){log(`Блокировка: байпас ${nm(k,0,'b')} включён, ${nm(k,0,'o')} включить нельзя`,'bad');return}
   if(D[k].failed){log(`Блокировка: привод ${k+1} в отказе`,'bad');return}
   D[k].oc=true;log(`${nm(k,0,'o')} включён`)}
  return}
 if(t=='b'){
  if(g.bp){g.bp=false;log(`${nm(k,0,'b')} отключён`);return}
  if(D[k].oc){log(`Блокировка: ${nm(k,0,'o')} включён, байпас включить нельзя`,'bad');return}
  const bad=g.kd.some((v,j)=>v&&Math.abs(g.w[j]-50)>3);
  if(bad)warn(k,'байпас включён на двигатели, частота которых не 50 Гц: бросок тока 6–7 In');
  g.bp=true;log(`${nm(k,0,'b')} включён: ~Hz = сеть`,bad?'warn':'ok');return}
 const a=nm(k,i,t),o=nm(k,i,t=='d'?'m':'d');
 if(t=='d'){
  if(!g.kd[i]){
   if(g.km[i]){log(`Ошибка: M${i+1} уже работает от сети (${o}). Подключить к нему привод нельзя, сначала отключите ${o}`,'bad');return}
   const b=bus(k),f=b.f;
   if(!g.bp){const z=kdOf(k);if(z){log(`Блокировка: привод ${d+1} уже ведёт M${z[1]+1} группы ${z[0]+1} (${nm(z[0],z[1],'d')}), ${a} включить нельзя`,'bad');return}}
   if(!b.m&&f>1&&g.w[i]<=3){log(`Привод на ${f.toFixed(0)} Гц, стоящий двигатель так подключать нельзя. Остановите привод (0 Гц), подключите M${i+1}, затем привод плавно поднимет частоту до 50 Гц`,'bad');return}
   if(f>.3&&Math.abs(g.w[i]-f)>3&&(g.w[i]>3||b.m))warn(k,b.m?`M${i+1} подключён к сети на ${g.w[i].toFixed(0)} Гц: бросок тока 6–7 In`:`M${i+1} подключён к приводу на другой частоте (${g.w[i].toFixed(0)} ≠ ${f.toFixed(0)} Гц): бросок тока`);
   g.kd[i]=true;log(`${a} включён`);
  }else{if(!bus(k).m&&outp(d)&&D[d].out>1)warn(k,`${a} отключён под током. Сначала снимите Run`);g.kd[i]=false;log(`${a} отключён`)}
 }else{
  if(!g.km[i]){

     if(g.w[i]<=3&&!outr(d))warn(k,`M${i+1} стоит, привод не работает: прямой пуск от сети, большой пусковой ток 6–7 In`);
     else{log(`Ошибка: M${i+1} вращается на ${g.w[i].toFixed(0)} Гц, а сеть 50 Гц. К сети можно подключать только на 50 Гц (~Hz = Hz), иначе бросок тока 6–7 In. Стоящий двигатель подключается напрямую только при остановленном приводе`,'bad');return}
    }
   g.km[i]=true;log(`${a} включён`,'ok');

 }
}
function togTie(){
 if(ST.on)return;
 if(D.some(d=>d.busy)||G.some(g=>g.auto)){log('Идёт автоматическая работа привода, подождите','bad');return}

/* ---------- автоматические операции ---------- */
async function until(f,ms=20000){const t=VT;while(!f()&&VT-t<ms)await sleep(50)}
function to50(d){D[d].run=true;D[d].set=50;$(`g${d}-sl`).value=50;$(`g${d}-sv`).textContent=50}
async function lock(k){
 for(let n=0;n<600;n++){
  if(D[0].failed&&D[1].failed)return -1;
  const d=drv(k);
  if(!D[d].failed&&!D[d].busy&&!(tie&&D[1-d].busy)){D[d].busy=true;return d}
  await sleep(100);
 }
 return -1;
}
async function xfer(k,i,d){
 const g=G[k];
 to50(d);await until(()=>D[d].failed||(D[d].out>=49.8&&g.w[i]>=48));
 if(D[d].failed)return false;
 log(`~Hz = Hz: привод ${d+1} и M${i+1} на 50 Гц`,'ok');
 g.kd[i]=false;log(`${nm(k,i,'d')} отключён`);await sleep(600);
 g.km[i]=true;log(`${nm(k,i,'m')} включён: M${i+1} на сети, привод ${d+1} свободен`,'ok');
 D[d].run=false;log(`Привод ${d+1} остановлен (0 Гц)`);return true;
}
async function softStart(k,i){
 const g=G[k];
 if(g.km[i]){log(`Гр.${k+1}: M${i+1} уже на сети`,'bad');return false}
 const d=await lock(k);
 if(d<0){log(`Гр.${k+1}: нет исправного привода`,'bad');return false}
 try{
  for(let z;z=kdOf(k,[k,i]);){
   if(G[z[0]].w[z[1]]>3||outp(d)){log(`Блокировка: привод ${d+1} уже ведёт M${z[1]+1} группы ${z[0]+1}`,'bad');return false}
   G[z[0]].kd[z[1]]=false;log(`${nm(z[0],z[1],'d')} отключён: подключённый, но стоящий двигатель освобождает привод ${d+1} для M${i+1}`,'warn');
  }
  log(`Гр.${k+1}: пуск M${i+1} приводом ${d+1}`);
  if(!g.kd[i]){
   D[d].run=false;await sleep(400);if(D[d].failed)return false;
   if(g.w[i]>3){log(`Гр.${k+1}: M${i+1} ещё вращается (${g.w[i].toFixed(0)} Гц), привод не может его разогнать и ждёт полной остановки`,'warn');await until(()=>D[d].failed||g.w[i]<=3,40000);if(D[d].failed)return false}
   g.kd[i]=true;log(`${nm(k,i,'d')} включён при 0 Гц`)}
  to50(d);log(`Привод ${d+1} плавно поднимает частоту до 50 Гц`);
  await until(()=>D[d].failed||(D[d].out>=49.8&&g.w[i]>=48)||(PRE&&better(k,i)));
  if(D[d].failed)return false;
  const bt=PRE&&!(D[d].out>=49.8&&g.w[i]>=48)&&better(k,i);
  if(bt){PREN++;log(`Приоритет: остановился M${bt[1]+1} группы ${bt[0]+1} (приоритет ${PR[bt[1]]}), он выше текущего M${i+1} (${PR[i]}). Привод ${d+1} бросает M${i+1} на ${g.w[i].toFixed(0)} Гц, тот уйдёт в выбег`,'warn');D[d].run=false;await sleep(400);g.kd[i]=false;return false}
  log(`M${i+1} разогнан до 50 Гц, передаю на сеть`,'ok');
  return await xfer(k,i,d);
 }finally{D[d].busy=false}
}
async function toMains(k,i){
 if(!G[k].kd[i]){log(`Гр.${k+1}: M${i+1} не на приводе`,'bad');return}
 const d=await lock(k);if(d<0)return;
 try{log(`Гр.${k+1}: передача M${i+1} на сеть на ходу`);await xfer(k,i,d)}finally{D[d].busy=false}
}
async function toDrive(k,i){
 const g=G[k];
 if(!g.km[i]){log(`Гр.${k+1}: M${i+1} не на сети`,'bad');return}
 const d=await lock(k);if(d<0)return;
 try{
  const z=kdOf(k);
  if(z){log(`Блокировка: привод ${d+1} уже ведёт M${z[1]+1} группы ${z[0]+1}. Сначала передайте его на сеть`,'bad');return}
  log(`Гр.${k+1}: возврат M${i+1} на привод ${d+1}`);
  to50(d);await until(()=>D[d].failed||D[d].out>=49.8);if(D[d].failed)return;
  log('Привод на 50 Гц, синхронно с сетью','ok');
  g.km[i]=false;log(`${nm(k,i,'m')} отключён`);await sleep(700);if(D[d].failed)return;
  g.kd[i]=true;log(`${nm(k,i,'d')} включён: привод подхватывает M${i+1} на ходу`,'ok');
 }finally{D[d].busy=false}
}
async function sw1(k,i){
 const g=G[k];if(D[k].busy)return false;D[k].busy=true;
 try{
  D[k].run=false;await sleep(400);
  g.kd.forEach((v,j)=>{if(v&&j!=i){g.kd[j]=false;log(`${nm(k,j,'d')} отключён: M${j+1} уходит в выбег (сети пока нет)`,'warn')}});
  if(!g.kd[i]){if(g.w[i]>3){log(`M${i+1} ещё вращается, жду остановки`,'warn');await until(()=>g.w[i]<=3,40000)}g.kd[i]=true;log(`${nm(k,i,'d')} включён при 0 Гц`)}
  to50(k);log(`Привод ${k+1} плавно поднимает M${i+1} до 50 Гц`);
  await until(()=>D[k].out>=49.8&&g.w[i]>=48);log(`M${i+1} разогнан до 50 Гц`,'ok');return true;
 }finally{D[k].busy=false}
}
async function seq1(k){const g=G[k];if(g.auto)return;g.auto=true;
 for(let i=0;i<4&&g.auto;i++)if(!await sw1(k,i))break;
 g.auto=false;log(`Гр.${k+1}: все двигатели по очереди прошли через привод`,'ok')}
/* этап 1: байпас */

 D[k].busy=true;
 try{

   if(g.w[z[1]]>3||outp(k)){log(`Блокировка: привод ${k+1} уже ведёт M${z[1]+1}. Переведите группу на байпас или остановите двигатель`,'bad');return}
   g.kd[z[1]]=false;log(`${nm(k,z[1],'d')} отключён: стоящий двигатель освобождает привод`,'warn');
  }
  log(`Гр.${k+1}: пуск M${i+1} приводом ${k+1}`);
  if(!g.kd[i]){
   D[k].run=false;await sleep(400);
   if(g.w[i]>3){log(`M${i+1} ещё вращается, жду остановки`,'warn');await until(()=>D[k].failed||g.w[i]<=3,40000)}
   if(D[k].failed)return;
   g.kd[i]=true;log(`${nm(k,i,'d')} включён при 0 Гц`)}
  to50(k);log(`Привод ${k+1} плавно поднимает частоту до 50 Гц`);
  await until(()=>D[k].failed||(D[k].out>=49.8&&g.w[i]>=48));
  if(!D[k].failed)log(`M${i+1} разогнан приводом до 50 Гц`,'ok');
 }finally{D[k].busy=false}
}
async function bypassOn(k){
 const g=G[k];
 if(g.bp){log('Байпас уже включён','bad');return}
 if(D[k].busy){log('Идёт переключение, подождите','bad');return}
 D[k].busy=true;
 try{
  const i=g.kd.findIndex(Boolean);
  if(i>=0&&outp(k)&&!D[k].failed){to50(k);await until(()=>D[k].failed||(D[k].out>=49.8&&g.w[i]>=48));if(!D[k].failed)log('~Hz = Hz: привод синхронен с сетью','ok')}
  if(D[k].oc){D[k].oc=false;log(`${nm(k,0,'o')} отключён`)}
  D[k].run=false;await sleep(700);
  g.bp=true;log(`${nm(k,0,'b')} включён: шина группы ${k+1} на сети, привод свободен`,'ok');
 }finally{D[k].busy=false}
}
async function bypassOff(k){
 const g=G[k];
 if(!g.bp){log('Группа не на байпасе','bad');return}
 if(D[k].failed){log(`Привод ${k+1} в отказе, вернуть на него шину нельзя`,'bad');return}
 if(D[k].busy){log('Идёт переключение, подождите','bad');return}
 if(g.kd.filter(Boolean).length>1){log('Блокировка: к шине подключено несколько двигателей, а привод ведёт только один. Отключите лишние','bad');return}
 D[k].busy=true;
 try{
  to50(k);await until(()=>D[k].failed||D[k].out>=49.8);if(D[k].failed)return;

  g.bp=false;log(`${nm(k,0,'b')} отключён`);await sleep(700);if(D[k].failed)return;
  D[k].oc=true;log(`${nm(k,0,'o')} включён: привод подхватывает двигатель на ходу`,'ok');
 }finally{D[k].busy=false}
}

/* ---------- автозапуск ---------- */
async function autoOld(k){ // без приоритетов: двигатели по порядку M1…M4 в своей группе
 const g=G[k];if(g.auto)return;g.auto=true;log(`Гр.${k+1}: автозапуск, двигатели по очереди`);
 for(let n=0;n<8&&g.auto;n++){
  const cur=g.kd.findIndex(Boolean),i=cur>=0?cur:g.km.findIndex(m=>!m);
  if(i<0){log(`Гр.${k+1}: все двигатели на сети`,'ok');break}
  const ok=await softStart(k,i);
  if(!ok){if(D[0].failed&&D[1].failed)break;await sleep(800);continue}
  await sleep(600);
 }
 g.auto=false;
}
// Состояние двигателя: mains — на сети, ready — стоит (или уже ведётся приводом), coast — крутится в выбеге, разогнать его приводом нельзя
function mst(m,i){const g=G[m];if(g.km[i])return'mains';if(g.w[i]<=3||(g.kd[i]&&pw(m,i).s=='drive'))return'ready';return'coast'}
// Следующий двигатель: приоритет 1…4; при равном приоритете сначала «свой» (группа рабочего привода), потом соседний
const better=(m,i)=>{for(const m2 of mem(m))for(let i2=0;i2<4;i2++)if((m2!=m||i2!=i)&&PR[i2]<PR[i]&&G[m2].w[i2]<=3&&!G[m2].km[i2])return[m2,i2];return null};
function pickNext(k){
 let sc=tie?[k,1-k]:[k];if(tie&&(ORD==1||(ORD==2&&ALT)))sc=[1-k,k];const skip=[];let t=null;
 for(let p=1;p<=4&&!t;p++)for(const m of sc){
  const i=PR.indexOf(p),s=mst(m,i);
  if(s=='ready'){t={m,i,p};break}
  if(s=='coast')skip.push(`гр.${m+1} M${i+1} (приоритет ${p}) ещё в выбеге`);
 }
 return{t,skip,done:sc.every(m=>G[m].km.every(Boolean))};
}
async function autoPrio(k){
 const g=G[k];if(g.auto)return;g.auto=true;log(`Гр.${k+1}: автозапуск, двигатели по приоритету`);
 let tries=0,waited=false;
 while(g.auto&&tries<20){
  if(D[0].failed&&D[1].failed){log('Оба привода отказали: автозапуск остановлен','bad');break}
  if(tie&&wd()!==k){const w=wd();log(`Гр.${k+1}: автозапуск передан приводу ${w+1}, он ведёт обе группы`);g.auto=false;if(!G[w].auto)autoAll(w);return}
  if(!tie&&D[k].failed){await sleep(200);continue}
  const r=pickNext(k);
  if(r.done){log(tie?'Все двигатели обеих групп на сети':`Гр.${k+1}: все двигатели на сети`,'ok');break}
  if(!r.t){
   if(!waited){log(`Привод ${drv(k)+1}: остановившихся двигателей нет, остальные ещё в выбеге, разгонять их нельзя. Жду полной остановки`,'warn');waited=true}
   await sleep(300);continue;
  }
  waited=false;
  const{m,i,p}=r.t;ALT=1-ALT;
  if(tie)log(`Приоритеты: привод ${drv(m)+1} берёт M${i+1} группы ${m+1} (приоритет ${p})`+(r.skip.length?`. Выше по приоритету пока нельзя: ${r.skip.join('; ')}`:''),'ok');
  const ok=await softStart(m,i);
  if(!ok){tries++;await sleep(800);continue}
  tries=0;await sleep(600);
 }
 g.auto=false;
}
const autoAll=k=>F.prio?autoPrio(k):F.km?autoOld(k):seq1(k);

/* ---------- отказ и восстановление ---------- */
async function recover(d){
 const o=1-d;
 await sleep(FAIL_MS);
 G[d].auto=false;
 log(`Привод ${d+1}: ${FAIL_MS/1000} с отказа прошли, возвращаю систему в исходное состояние`,'warn');
 for(let n=0;n<10;n++){
  await until(()=>!G[d].auto&&!D[o].busy&&!D[d].busy,60000);
  const i=G[d].kd.findIndex((v,j)=>v&&G[d].w[j]>3);
  if(i<0||D[o].failed)break;
  await toMains(d,i);
 }
 D[d].failed=false;
 log(`Привод ${d+1}: статус отказа снят, привод в норме`,'ok');
 if(tie&&!D[o].failed){tie=false;log(`KMс отключён: привод ${d+1} снова ведёт только группу ${d+1}, привод ${o+1} только группу ${o+1}`,'ok')}
 D[d].oc=true;log(`${nm(d,0,'o')} включён: выход привода ${d+1} снова подключён к шине`,'ok');
 const g=G[d],run=g.km.filter((m,i)=>m&&g.w[i]>=48).length;
 if(run===4){log(`Гр.${d+1}: проверка после восстановления: все 4 двигателя работают от сети на 50 Гц`,'ok');return}
 log(`Гр.${d+1}: проверка после восстановления: от сети на 50 Гц работает ${run} из 4. Остальные привод ${d+1} запустит и передаст на сеть`,'warn');
 if(!g.auto)autoAll(d);
}
async function failover(d){
 const g=G[d];
 log(`Резерв: двигатели группы ${d+1} переводятся на сеть`,'warn');
 while(D[d].failed&&!g.km.every(Boolean)){
  const i=g.km.findIndex((m,j)=>!m&&g.w[j]<=3);
  if(i<0){await sleep(200);continue}
  g.kd[i]=false;g.km[i]=true;
  log(`${nm(d,i,'m')} включён: прямой пуск M${i+1} от сети, большой пусковой ток 6–7 In`,'warn');
  await sleep(1000);
 }
 if(g.km.every(Boolean))log(`Гр.${d+1}: все двигатели на сети, привод ${d+1} в ремонте`,'ok');
}
async function onFail(d){
 const o=1-d,sv=mem(d).filter(m=>drv(m)===d);
 D[d].failed=true;D[d].run=false;D[d].out=0;D[d].fat=VT;
 if(F.timer)recover(d);
 if(F.oc){D[d].oc=false;log(`${nm(d,0,'o')} отключён: отказавший привод ${d+1} отделён от шины ~Hz`,'warn')}
 warn(d,`ОТКАЗ привода ${d+1}, выход отключён`);
 await sleep(700);
 if(F.kd)sv.forEach(m=>G[m].kd.forEach((v,i)=>{if(v){G[m].kd[i]=false;log(`${nm(m,i,'d')} отключён из-за отказа, M${i+1} группы ${m+1} в выбеге`,'warn')}}));
 if(!F.kd)log(`Двигатели группы ${d+1} остановились: привод был единственным источником питания`,'bad');
 else if(F.res&&!F.tie){G[d].auto=false;failover(d);return}
 else if(!F.tie){
  const n=G[d].km.filter(Boolean).length;
  log(F.bp?`Привод ${d+1} отказал. Группу можно перевести на сеть байпасом ${nm(d,0,'b')}`:`Привод ${d+1} отказал: двигатели на сети (${n}) продолжают работать, остальные без управления. Резервного привода нет`,'bad');
 }
 if(!F.tie)return;
 if(D[o].failed){log('Оба привода отказали: управление двигателями невозможно','bad');return}
 if(!tie){await sleep(500);tie=true;log(`KMс включён: шина группы ${d+1} подключена к приводу ${o+1}`,'ok')}
 log(`Привод ${o+1} принимает управление двигателями группы ${d+1}`,'ok');
 if(F.prio){if(sv.length&&!G[o].auto)autoAll(o)}else sv.forEach(m=>{if(!G[m].auto)autoAll(m)});
}

/* ---------- физика и отрисовка ---------- */
function step(dt){
 D.forEach(x=>{x.out=x.run&&!x.failed?x.out+cl(x.set-x.out,12*dt):0});
 G.forEach((g,k)=>g.w.forEach((w,i)=>{const p=pw(k,i);g.w[i]=p.f>.3?w+cl(p.f-w,(p.s=='mains'?25:15)*dt):Math.max(0,w-3*dt);g.ang[i]=(g.ang[i]+g.w[i]*dt*7)%360}));
}
const col=(on,s)=>on?(s=='mains'?'var(--mains)':'var(--drive)'):'var(--off)';
function draw(){
 const st=(id,c)=>{const e=$(id);if(e)e.style.stroke=c},any=outp(0)||outp(1);
 st('top','var(--mains)');
 if(F.tie){st('tl',col(tie&&any,'drive'));st('tr',col(tie&&any,'drive'));const tb=$('tbl');tb.setAttribute('y2',tie?150:138);tb.style.stroke=tie?'var(--fg)':'var(--mute)'}
 [0,1].forEach(k=>{
  const P=`g${k}-`,g=G[k],dr=D[k],b=bus(k),live=b.f>.3,bc=b.m?'mains':'drive';
  const bl=(id,on)=>{const e=$(P+id);if(!e)return;const l=e.querySelector('.bl'),x=+l.getAttribute('x1');l.setAttribute('x2',on?x:x+12);l.style.stroke=on?'var(--fg)':'var(--mute)'};
  ['sd','mb','d','bpa'].forEach(id=>st(P+id,'var(--mains)'));
  st(P+'e',col(outr(k),'drive'));st(P+'e2',col(outp(k),'drive'));bl('oc',dr.oc);
  st(P+'bpb',col(g.bp,'mains'));bl('bp',g.bp);
  st(P+'bus',col(live,bc));
  $(P+'df').textContent=dr.failed?`АВАРИЯ${F.timer?(left(k)>0?` ${left(k)} с`:' · возврат'):''}`:(dr.run?dr.out:0).toFixed(1)+' Гц';
  $(P+'df').style.fill=dr.failed?'var(--bad)':'var(--fg)';
  $(P+'box').style.stroke=dr.failed?'var(--bad)':'var(--fg)';
  $(P+'bf').textContent=live?`~Hz: ${b.f.toFixed(1)} Гц`+(b.m?' (сеть, байпас)':b.d!=k?` (привод ${b.d+1})`:''):'~Hz: нет напряжения';
  XS.forEach((x,i)=>{const p=pw(k,i);
   bl('kd'+i,g.kd[i]);bl('km'+i,g.km[i]);
   st(P+'t'+i,col(live,bc));st(P+'v'+i,col(g.kd[i]&&live,bc));st(P+'l'+i,col(g.km[i],'mains'));st(P+'z'+i,col(1,'mains'));
   $(P+'mc'+i).style.stroke=p.f>.3?col(1,p.s):(g.w[i]>.5?'var(--warn)':'var(--off)');
   $(P+'mr'+i).setAttribute('transform',`rotate(${g.ang[i]})`);
   $(P+'mt'+i).textContent=`M${i+1} ${g.w[i].toFixed(0)} Гц`;
   $(P+'mu'+i).textContent=p.f>.3?(p.s=='mains'?'сеть':'привод'):(g.w[i]>.5?'выбег':'стоп');
  });
  const sb=(id,fn)=>{const e=$(P+id);if(e)fn(e)};
  sb('aa',e=>e.textContent=g.auto?'Остановить автозапуск':F.km?'Автозапуск всех двигателей':'Запустить все по очереди');
  sb('run',e=>{e.textContent=dr.run?'Стоп привода':'Пуск привода';e.classList.toggle('on',dr.run);e.disabled=g.auto||dr.failed});
  ['ts','td','s1'].forEach(id=>sb(id,e=>e.disabled=g.auto));
  sb('fail',e=>{e.textContent=dr.failed?(F.timer?(left(k)>0?`Отказ: восстановление через ${left(k)} с`:'Отказ: возврат системы…'):'Восстановить привод'):'Отказ привода';e.disabled=dr.failed&&!!F.timer});
  const kdn=g.kd.filter(Boolean).length,kmn=g.km.filter(Boolean).length;
  const cnt=F.km?`Двигатели группы: на приводе <b>${kdn}</b>, на сети <b>${kmn}</b>.`:F.kd?`Подключено к шине: <b>${kdn}</b>${g.bp?'. Шина на сети (байпас)':''}.`:'Все четыре двигателя группы питаются от привода.';
  $(P+'st').innerHTML=`Привод ${k+1}: <b>${dr.failed?'отказ':dr.run?'работает':'остановлен'}</b>. ${cnt}`+(F.oc&&!dr.oc?` Выход привода отключён от шины (${nm(k,0,'o')}).`:'')+(dr.busy?' Идёт переключение…':'');
 });
 if(F.tie){$('tiebtn').textContent=tie?'Отключить KMс':'Включить KMс';$('tst').textContent=tie?'KMс включён: шины соединены':'KMс отключён: каждый привод ведёт свою группу'}
 if(ST.on&&ST.cur>=0)$('bd').textContent=`${ST.phase}. ${CASES[ST.cur].d}  [время кейса ${fmt(Math.max(0,VT-ST.t0))}]`;
}
function loop(t){
 const dt=Math.min(.1,(t-last)/1000);last=t;
 const vdt=dt*SPEED,n=Math.max(1,Math.ceil(vdt/.05));
 for(let i=0;i<n;i++)step(vdt/n);
 VT+=vdt*1000;pump();
 if(ST.on){const v=inv();if(v&&!ST.viol)ST.viol=v}
 draw();requestAnimationFrame(loop);
}

/* ---------- кейсы и стресс-тест ---------- */
const W=async(f,ms=120000)=>{const t=VT;while(!f()&&VT-t<ms&&!DEAD())await rsleep(100);return f()};
const all8=()=>G.every(g=>g.km.every((m,i)=>m&&g.w[i]>=48));
const calm=()=>all8()&&!tie&&!D[0].failed&&!D[1].failed&&!D.some(d=>d.busy)&&!G.some(g=>g.auto)&&D.every(d=>d.oc);
const CASES=[
 {n:'Штатный пуск обеих групп',d:'Отказов нет. Каждый привод запускает свою группу по приоритету 1→4 и передаёт двигатели на сеть.',
  run:async()=>{autoAll(0);autoAll(1)}},
 {n:'Отказ привода 1 до пуска',d:'Все 8 двигателей стоят. Привод 1 отказывает, KMс замыкается, привод 2 запускает двигатели обеих групп по приоритету: свой, затем соседний. Через 20 с привод 1 возвращается и доводит остаток.',
  run:async()=>{onFail(0)}},
 {n:'Отказ привода 1 при разгоне первого двигателя',d:'M1 группы 1 (приоритет 1) уходит в выбег. Привод 2 не может его разгонять и берёт остановившиеся двигатели по приоритету, а M1 группы 1 запускает после остановки.',
  run:async()=>{autoAll(0);await rsleep(3500);onFail(0)}},
 {n:'Отказ привода 1 при частично запущенной группе',d:'M1 и M2 уже на сети, M3 разгоняется приводом. После отказа M3 в выбеге, M1 и M2 продолжают работать от сети, остальное запускает привод 2.',
  run:async()=>{autoAll(0);await W(()=>G[0].km[0]&&G[0].km[1]&&G[0].kd[2]&&G[0].w[2]>15,90000);onFail(0)}},
 {n:'Отказ привода при полностью запущенных группах',d:'Все 8 двигателей уже на сети. Отказ привода ничего не останавливает. Проверяется, что KMс замыкается и размыкается, и система возвращается в исходное состояние.',
  run:async()=>{autoAll(0);autoAll(1);await W(all8,400000);await rsleep(1000);onFail(0)}},
 {n:'Отказ привода 2 при одновременном пуске двух групп',d:'Зеркальный случай. Привод 2 отказывает в начале пуска, привод 1 ведёт обе группы: сначала свой двигатель приоритета 1, затем соседний, и так далее.',
  run:async()=>{autoAll(0);autoAll(1);await rsleep(3500);onFail(1)}},
 {n:'Двойной отказ приводов',d:'Привод 1 отказывает, затем отказывает и привод 2, который его подменял. Запуск невозможен, двигатели на сети живут. Через 20 с после каждого отказа привод возвращается и запускает свои двигатели.',
  run:async()=>{autoAll(0);autoAll(1);await rsleep(3500);onFail(0);await rsleep(4500);onFail(1)}},
 {n:'Повторный отказ после восстановления',d:'Привод 1 отказал, восстановился, начал проверку и запуск своих двигателей и отказал снова. Система должна пройти цикл ещё раз без зависаний.',
  run:async()=>{autoAll(0);await rsleep(3500);onFail(0);await W(()=>!D[0].failed&&!tie,90000);await rsleep(2500);onFail(0)}},
 {n:'Отказ при разгоне до 30 Гц, вытеснение по приоритету',pre:1,d:'Включено вытеснение. Привод 1 отказывает на ~30 Гц. Привод 2 берёт следующий свободный двигатель, а когда двигатель приоритета 1 группы 1 остановится, бросает текущий и берёт его.',
  run:async()=>{autoAll(0);autoAll(1);await W(()=>G[0].w[0]>=30,60000);onFail(0)},chk:()=>PREN>0},
 {n:'Отказ привода 1, порядок «по очереди»',ord:2,d:'При равном приоритете привод поочерёдно берёт двигатель своей и чужой группы.',
  run:async()=>{autoAll(0);autoAll(1);await rsleep(3500);onFail(0)}},
 {n:'Отказ привода 2, порядок «сначала чужой», вытеснение',pre:1,ord:1,d:'Привод 1 при равном приоритете сначала берёт двигатель отказавшего привода, вытеснение включено.',
  run:async()=>{autoAll(0);autoAll(1);await W(()=>G[1].w[0]>=30,60000);onFail(1)}}
];
function inv(){ // проверка недопустимых состояний
 if(tie&&outp(0)&&outp(1))return'при замкнутом KMс оба привода выдают частоту';
 const n=G.map(g=>g.kd.filter(Boolean).length);
 if(tie?n[0]+n[1]>1:(n[0]>1||n[1]>1))return'к приводу подключено больше одного двигателя';
 for(let k=0;k<2;k++)for(let i=0;i<4;i++)if(G[k].kd[i]&&G[k].km[i])return`M${i+1} группы ${k+1} одновременно на приводе и на сети`;
 for(let k=0;k<2;k++)if(tie&&D[k].failed&&D[k].oc)return`отказавший привод ${k+1} подключён к шине`;
 return null;
}
function setBanner(t,d,c){$('bt').textContent=t;$('bd').textContent=d;$('sbar').className='banner'+(c?' '+c:'');$('stbtn').textContent=ST.on?'Остановить стресс-тест':'Запустить стресс-тест'}
function idleBanner(){setBanner('Стресс-тест всех кейсов','Нажмите кнопку: все двигатели станут 0 Гц, затем по очереди покажутся все кейсы. Название текущего кейса будет написано здесь.')}
function renderCases(){
 if(!F.stress)return;
 $('cases').innerHTML=`<h2>Кейсы системы</h2><p>Кейсы собраны из двух признаков: какой привод отказал (1 или 2) и в какой момент (до пуска, при разгоне первого двигателя, часть двигателей уже на сети, все на сети). Отдельно проверяются двойной и повторный отказы.</p><div class="scroll"><table class="cases"><thead><tr><th>№</th><th>Кейс</th><th>Что происходит и что проверяется</th><th>Результат</th></tr></thead><tbody>${CASES.map((c,i)=>{const r=ST.res[i],cur=ST.on&&ST.cur===i;const chip=r?(r.ok?'<span class="chip ok">пройден</span>':`<span class="chip bad">не пройден${r.msg?': '+r.msg:''}</span>`):cur?'<span class="chip run">идёт</span>':'<span class="chip">ожидает</span>';return`<tr class="${cur?'cur':''}"><td>${i+1}</td><td><b>${c.n}</b></td><td>${c.d}</td><td>${chip}</td></tr>`}).join('')}</tbody></table></div>`;
}
async function hardReset(){
 abortAll();await new Promise(r=>setTimeout(r,0));mkState();
 [0,1].forEach(k=>{$(`g${k}-sl`).value=35;$(`g${k}-sv`).textContent=35});
}
async function stress(){
 if(ST.on){ST.cancel=true;return}
 const my=++RUN;
 DEAD=()=>ST.cancel||my!==RUN;
 ST.on=true;ST.cancel=false;ST.res=[];ST.cur=-1;document.body.classList.add('stress');
 log('─── Стресс-тест: запуск ───','sep');
 for(let ci=0;ci<CASES.length&&!DEAD();ci++){
  ST.cur=ci;ST.phase='Подготовка: все двигатели останавливаются (0 Гц)';ST.t0=VT;ST.viol=null;
  setBanner(`Кейс ${ci+1} из ${CASES.length}: ${CASES[ci].n}`,'','run');renderCases();
  await hardReset();log(`─── Кейс ${ci+1}: ${CASES[ci].n} ───`,'sep');
  await rsleep(2500);if(DEAD())break;
  ST.t0=VT;ST.phase='Кейс выполняется';
  PREN=0;PRE=CASES[ci].pre||0;ORD=CASES[ci].ord||0;ALT=0;
  await CASES[ci].run();if(DEAD())break;
  ST.phase='Ожидание возврата системы в исходное состояние';
  const ok=await W(calm,600000);if(DEAD())break;
  const v=ST.viol;
  const ch=!CASES[ci].chk||CASES[ci].chk();ST.res[ci]={ok:ok&&!v&&ch,msg:!ok?'система не вернулась в исходное состояние':v||(ch?'':'ожидаемое событие не произошло')};
  log(`Кейс ${ci+1}: ${ST.res[ci].ok?'пройден':'НЕ пройден — '+ST.res[ci].msg}`,ST.res[ci].ok?'ok':'bad');
  ST.phase='Кейс завершён';renderCases();await rsleep(2500);
 }
 if(my!==RUN)return;
 const cancelled=ST.cancel,okn=ST.res.filter(r=>r&&r.ok).length;
 ST.on=false;ST.cur=-1;ST.cancel=false;document.body.classList.remove('stress');PRE=+$('pre').checked;ORD=+$('ord').value;
 await hardReset();
 if(cancelled)setBanner('Стресс-тест остановлен','Все двигатели сброшены в 0 Гц. Пройдено кейсов: '+okn+' из '+ST.res.filter(Boolean).length+' завершённых.');
 else setBanner(`Стресс-тест завершён: пройдено ${okn} из ${CASES.length}`,okn===CASES.length?'Все кейсы закончились возвратом в исходное состояние без нарушений блокировок.':'Есть непройденные кейсы, смотрите таблицу ниже.',okn===CASES.length?'done':'fail');
 renderCases();
}

/* ---------- этапы ---------- */
function info(){
 const s=STG[stage];
 $('info').innerHTML=`<h2>${s.title}</h2>`+(s.slide?`<p class="slide">${s.slide}</p>`:'')+`<p>${s.text}</p><ul>${s.how.map(x=>`<li>${x}</li>`).join('')}</ul>`+MODES[stage];
}
function setStage(n){
 RUN++;ST.on=false;ST.cancel=false;ST.cur=-1;ST.res=[];document.body.classList.remove('stress');
 abortAll();stage=n;F=STG[n].F;mkState();
 $('grid').innerHTML='';$('log').innerHTML='';
 scene();[0,1].forEach(ctl);
 $('tiebtn').style.display=F.tie?'':'none';if(!F.tie)$('tst').textContent='';
 $('opts').hidden=!F.prio;$('sbar').hidden=!F.stress;$('cases').hidden=!F.stress;
 document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('on',i==n));
 info();idleBanner();renderCases();
 if($('tie'))$('tie').onclick=U(togTie);
 document.querySelectorAll('.kc').forEach(el=>el.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();el.dispatchEvent(new Event('click'))}});
 log(`Этап «${STG[n].tab}»: двигатели остановлены, контакторы в исходном положении`);
}
function init(){
 $('tabs').innerHTML=STG.map((s,i)=>`<button role="tab" data-i="${i}">${s.tab}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setStage(+b.dataset.i));
 $('tiebtn').onclick=U(togTie);$('stbtn').onclick=stress;
 $('pre').onchange=e=>PRE=+e.target.checked;$('ord').onchange=e=>ORD=+e.target.value;
 $('spd').onchange=e=>SPEED=+e.target.value;
 $('reset').onclick=()=>location.reload();
 setStage(0);
}
init();requestAnimationFrame(loop);
</script>
</body>
</html>
